product:
  name: <name your product>
  idea: 'Future Token Predictor is an MCP server that forecasts the LLM token usage
    and dollar cost of an agentic workflow before it runs - treating tokens as "agentic
    currency." Given a natural-language or structured description of an agent (model,
    tools, multi-step loops, RAG, multimodal inputs, user/volume scale), it returns
    predicted token breakdowns (prompt, output, hidden reasoning, context growth)
    and cost ranges with Monte Carlo confidence intervals across major providers (starting
    with Microsoft Foundry), using a 3-tier cascade: heuristic+Monte Carlo baseline,
    optional regression calibration on historical logs, then optional LLM-assisted
    estimation, always returning a usable range even when later tiers are unavailable.
    Out of scope for this MVP: live Azure infrastructure pricing and footprint sizing
    (compute, egress, concurrency) - that is a separate Azure/Foundry MCP server composed
    on top, not part of this predictor. Done when an MCP client can describe an agentic
    workload and get a per-call token breakdown plus a scaled (daily/monthly) cost
    range with confidence intervals, across at least the Foundry provider set.'
  status: shaping
  tech_stack:
  - name: Python 3.11+
    role: Implementation language and runtime for the predictor pipeline and MCP server
  - name: MCP SDK (mcp, stdio)
    role: Model Context Protocol server framework exposing the 6 prediction tools
      to MCP clients
  - name: tiktoken
    role: Provider tokenization / token counting for prompt and output estimation
  - name: NumPy
    role: Monte Carlo simulation and statistical confidence-interval math
  - name: httpx
    role: Async HTTP client for live model-catalog and provider pricing lookups
  - name: PyYAML
    role: Loads archetype profiles and config from data YAML
  - name: azure-identity
    role: Authentication for Microsoft Foundry / Azure model catalog access
  - name: python-dotenv
    role: Local environment/config loading
  - name: hatchling
    role: Build backend for the src-layout package
  - name: pytest + pytest-asyncio + respx
    role: Test runner and HTTP mocking for the verification suite
blocks:
- id: B0
  title: classifier
  goal: 'Adopted seam: src/future_token_predictor/classifier.py.'
  status: done
  origin: adopted
  runner: pytest
  depends_on: []
  module: src/future_token_predictor/classifier.py
  acceptance_test: tests/test_classifier.py
  decision:
    rationale: Capability cost-lever detection (prompt caching, batch API, streaming,
      retrieval) lives in the classifier's existing regex-fallback stage as four module-level
      precompiled patterns plus four boolean flags on UseCaseProfile, rather than
      a new module. Keeps all NL->profile signal extraction in one seam and mirrors
      the existing _MODEL_PATTERNS/_detect_* style.
    pattern: Precompiled-regex detection table + dataclass capability flags, set in
      the strategy-fallback classify() pipeline (LLM-first, regex always runs for
      these signals).
    complexity: O(n) per flag over description length with 4 precompiled patterns;
      constant extra memory; negligible vs existing detectors.
    provenance: authored
  checkpoint_tag: weave/B0
- id: B1
  title: llm_classifier
  goal: 'Adopted seam: src/future_token_predictor/llm_classifier.py.'
  status: done
  origin: adopted
  runner: pytest
  depends_on: []
  module: src/future_token_predictor/llm_classifier.py
  acceptance_test: tests/test_llm_classifier.py
  decision:
    rationale: Extended the in-file LLMClassification dataclass and _parse_classification
      rather than touching schemas.py or classifier.py, keeping all changes inside
      B1's seam. Tolerant extraction added as a fallback only (strict json.loads still
      tried first) so existing clean-JSON behaviour is unchanged. The four cost-lever
      booleans mirror B0's UseCaseProfile flags to surface the same signal from the
      LLM path; they default False and are not yet consumed by classify() (which sets
      the profile flags via regex) -- wiring them in is a future B0-seam change, deliberately
      out of scope here.
    pattern: Fallback parser + structured-output schema extension; first-balanced-object
      regex extraction guards prose-wrapped replies.
    complexity: O(n) over the reply text for the single regex scan; no extra LLM calls
      or allocations on the happy path.
    provenance: authored
  checkpoint_tag: weave/B1
