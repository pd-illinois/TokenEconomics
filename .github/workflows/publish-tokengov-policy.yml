name: Publish reviewed TokenGov policy

on:
  push:
    branches:
      - main
    paths:
      - data/policies/*.json
      - data/policy_reviews/*.json
  workflow_dispatch:
    inputs:
      policy_path:
        description: Versioned policy JSON under data/policies
        required: true
        type: string
      expected_etag:
        description: Reviewed ETag of the currently authoritative policy
        required: true
        type: string
      action:
        description: Publication intent
        required: true
        type: choice
        options:
          - publish
          - rollback

permissions:
  contents: read
  id-token: write

concurrency:
  group: tokengov-production-policy
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      policy_path: ${{ steps.review.outputs.policy_path }}
      expected_etag: ${{ steps.review.outputs.expected_etag }}
      change_id: ${{ steps.review.outputs.change_id }}
      action: ${{ steps.review.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve merged review manifest
        id: review
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            {
              echo "policy_path=${{ inputs.policy_path }}"
              echo "expected_etag=${{ inputs.expected_etag }}"
              echo "change_id=manual-${{ github.run_id }}"
              echo "action=${{ inputs.action }}"
            } >> "$GITHUB_OUTPUT"
          else
            python scripts/resolve_policy_review.py \
              --before "${{ github.event.before }}" \
              --after "${{ github.sha }}" \
              --output "$GITHUB_OUTPUT"
            echo "action=publish" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate reviewed policy artifact
        run: >-
          python scripts/publish_tokengov_policy.py
          "${{ needs.resolve.outputs.policy_path }}"
          --expected-etag "${{ needs.resolve.outputs.expected_etag }}"
          --action "${{ needs.resolve.outputs.action }}"
          --endpoint "https://appcs-xbk6ickycmp22.azconfig.io"
          --key "tokengov:policy"
          --label "te003-live-v2"
          --validate-only

  publish:
    if: github.ref == 'refs/heads/main'
    needs:
      - resolve
      - validate
    runs-on: ubuntu-latest
    environment: tokengov-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publisher dependencies
        run: pip install --disable-pip-version-check azure-appconfiguration azure-identity
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish with ETag concurrency and verify
        run: >-
          python scripts/publish_tokengov_policy.py
          "${{ needs.resolve.outputs.policy_path }}"
          --expected-etag "${{ needs.resolve.outputs.expected_etag }}"
          --action "${{ needs.resolve.outputs.action }}"
          --endpoint "https://appcs-xbk6ickycmp22.azconfig.io"
          --key "tokengov:policy"
          --label "te003-live-v2"
          --output publication-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokengov-publication-evidence-${{ github.run_id }}
          path: publication-evidence.json
          if-no-files-found: warn
          retention-days: 90
