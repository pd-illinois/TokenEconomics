[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "future-token-predictor"
version = "0.1.0"
description = "Predict total LLM token usage and cost for multimodal agentic workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "pdhiman" }]
dependencies = [
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "azure-identity>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
future-token-predictor = "future_token_predictor.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/future_token_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
